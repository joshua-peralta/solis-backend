type Query {
    "Fetch all products with optional filters and sorting"
    products(
        roast: String @scope
        process: String @scope
        is_featured: Boolean @eq
        orderBy: _ @orderBy(columns: ["id", "created_at", "name"])
    ): [Product!]! @all

    "Fetch a single product by slug"
    product(slug: String! @eq): Product @find

    "Fetch product categories"
    categories: [Category!]! @all

    "Retrieve the authenticated customer profile"
    me: User @auth

    "Fetch order history for the authenticated customer"
    myOrders: [Order!]! @guard(with: ["sanctum"]) @field(resolver: "App\\GraphQL\\Queries\\OrderQuery@myOrders")
}

type Mutation {
    "Customer registration"
    register(
        name: String! @rules(apply: ["required", "max:100"])
        email: String! @rules(apply: ["required", "email", "unique:users,email"])
        password: String! @rules(apply: ["required", "min:6"])
    ): AuthPayload! @field(resolver: "App\\GraphQL\\Mutations\\AuthMutator@register")

    "Customer login"
    login(
        email: String! @rules(apply: ["required", "email"])
        password: String! @rules(apply: ["required"])
    ): AuthPayload! @field(resolver: "App\\GraphQL\\Mutations\\AuthMutator@login")

    "Customer logout"
    logout: LogoutResponse! @field(resolver: "App\\GraphQL\\Mutations\\AuthMutator@logout") @guard

    "Submit a customer support contact inquiry"
    submitContactMessage(
        name: String! @rules(apply: ["required", "max:100"])
        email: String! @rules(apply: ["required", "email"])
        order_number: String @rules(apply: ["nullable", "max:50"])
        inquiry_type: String! @rules(apply: ["required"])
        message: String! @rules(apply: ["required", "min:10"])
    ): ContactMessage! @create

    "Update or save authenticated customer default address"
    updateAddress(
        street: String! @rules(apply: ["required", "max:255"])
        city: String! @rules(apply: ["required", "max:100"])
        state: String! @rules(apply: ["required", "max:100"])
        postal_code: String! @rules(apply: ["required", "max:20"])
    ): Address! @guard(with: ["sanctum"]) @field(resolver: "App\\GraphQL\\Mutations\\OrderMutator@updateAddress")

    "Checkout creation: Create a new order with items"
    createOrder(
        items: [OrderItemInput!]! @rules(apply: ["required", "min:1"])
    ): Order! @guard(with: ["sanctum"]) @field(resolver: "App\\GraphQL\\Mutations\\OrderMutator@createOrder")
}

input OrderItemInput {
    product_variant_id: ID!
    quantity: Int!
}

type AuthPayload {
    token: String!
    user: User!
}

type LogoutResponse {
    status: String!
    message: String!
}

type User {
    id: ID!
    name: String!
    email: String!
    created_at: String!
    addresses: [Address!]! @hasMany
    orders: [Order!]! @hasMany
}

type Address {
    id: ID!
    street: String!
    city: String!
    state: String!
    postal_code: String!
    is_default: Boolean!
}

type Order {
    id: ID!
    order_number: String!
    status: String!
    subtotal_cents: Int!
    shipping_cents: Int!
    total_cents: Int!
    created_at: String!
    items: [OrderItem!]! @hasMany
}

type OrderItem {
    id: ID!
    quantity: Int!
    unit_price_cents: Int!
    variant: ProductVariant! @belongsTo
}

type Category {
    id: ID!
    name: String!
    slug: String!
    description: String
    products: [Product!]! @hasMany
}

type Product {
    id: ID!
    name: String!
    slug: String!
    description: String!
    origin: String
    process_type: String!
    flavor_profile: String
    roaster_notes: String
    is_featured: Boolean!
    category: Category! @belongsTo
    variants: [ProductVariant!]! @hasMany @with
    images: [ProductImage!]! @hasMany @with
}

type ProductVariant {
    id: ID!
    sku: String!
    roast_level: String!
    grind_size: String!
    price_cents: Int!
    stock: Int!
}

type ProductImage {
    id: ID!
    url: String!
    is_primary: Boolean!
    sort_order: Int!
}

type ContactMessage {
    id: ID!
    name: String!
    email: String!
    order_number: String
    inquiry_type: String!
    message: String!
    created_at: String!
}